area:
  id: smmusd
  name: Santa Monica-Malibu Unified School District
  # FIPS codes is hte US gov id for places CA is 06
  boundary: { source: tiger_unified_school_district, state_fips: "06",
              name: "Santa Monica-Malibu Unified School District" }
  # max bike distance + margin, so edge schools see full zones
  buffer_m: 3500 
  # California Albers -> projected coordinate reference system 
  # Flattens CA onto a grid measured in meters to measure distances
  # and areas easier
  crs: "EPSG:3310"

schools:
  sources: [cde_pubschls, cde_private, nces_private_locations]
  # any K-12 school located inside the area boundary
  select: within_boundary
  sectors: [public, private]
  exclude_virtual: ["F"]
  instruction_levels: [ELEM, INTMIDJR, HS, ELEMHIGH]
  # Santa Monica and Malibu as separate groups in charts
  groups: { by: city }           

zones:
  elementary: { walk_m: 800,  bike_m: 1600 }
  secondary:  { walk_m: 1600, bike_m: 3200 }

