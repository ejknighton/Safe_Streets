[project]
name = "saferoutes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ejknighton", email = "edknight@umich.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "jinja2>=3.1.6",
    "networkx>=3.7",
    "osmnx>=2.1.1",
    "pandas>=3.1.0",
    "pandera[geopandas]>=0.35.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "typer>=0.27.3",
]

[project.scripts]
saferoutes = "saferoutes:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
